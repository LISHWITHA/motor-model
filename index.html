<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Motor Viewer</title>
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: #181b1f; 
      font-family: sans-serif;
    }
    model-viewer { 
      width: 100vw; 
      height: 100vh; 
    }
    .controls { 
      position: absolute; 
      top: 15px; 
      left: 15px; 
      display: flex; 
      flex-direction: column; 
      gap: 6px; 
      z-index: 10; 
      max-height: 90vh; 
      overflow-y: auto; 
    }
    button { 
      padding: 8px 14px; 
      background: #0096ff; 
      color: white; 
      border: none; 
      border-radius: 6px; 
      cursor: pointer; 
      font-weight: bold; 
      font-size: 12px; 
      text-align: left; 
    }
    button:hover { 
      background: #0076ce; 
    }
  </style>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>

  <div class="controls">
    <button onclick="toggleComponent(['rotor'])">Rotor</button>
    <button onclick="toggleComponent(['shaft'])">Shaft</button>
    <button onclick="toggleComponent(['bearing'])">Bearings</button>
    <button onclick="toggleComponent(['winding', 'coil'])">Windings</button>
    <button onclick="toggleComponent(['fan', 'cool', 'cover', 'guard', 'cap', 'rear'])">Fan / Cooling</button>
    <button onclick="toggleComponent(['seal', 'gasket'])">Seals</button>
    <button onclick="toggleComponent(['mount', 'base', 'feet'])">Mounting</button>
    <button onclick="toggleComponent(['bolt', 'screw', 'fastener', 'pin'])">Bolts / Fasteners</button>
    <button onclick="toggleComponent(['stator', 'housing', 'casing', 'body', 'frame', 'shell', 'main', 'outer'])">Stator</button>
    <button onclick="showAll()">Show All</button>
  </div>

  <model-viewer 
    id="motor"
    src="https://cdn.jsdelivr.net/gh/LISHWITHA/motor-model@main/total-electricmotor.glb" 
    alt="3D Induction Motor" 
    auto-rotate 
    camera-controls 
    shadow-intensity="1">
  </model-viewer>

  <script>
    const viewer = document.querySelector('#motor');

    window.toggleComponent = function(keywords) {
      if (!viewer.model) return;

      // Toggle both Material Alpha AND Scene Node Visibility
      viewer.model.materials.forEach(mat => {
        const name = mat.name.toLowerCase();
        if (keywords.some(kw => name.includes(kw.toLowerCase()))) {
          const currentAlpha = mat.getAlphaFactor();
          mat.setAlphaFactor(currentAlpha === 0 ? 1 : 0);
        }
      });
    };

    window.showAll = function() {
      if (!viewer.model) return;
      viewer.model.materials.forEach(mat => mat.setAlphaFactor(1));
    };
  </script>
</body>
</html>
