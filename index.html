<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Twin of Induction Motor</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #181b1f; font-family: sans-serif; }
    model-viewer { width: 100vw; height: 100vh; }
    .controls { position: absolute; top: 20px; left: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 10; max-height: 90vh; overflow-y: auto; }
    button { padding: 8px 16px; background: #0096ff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; text-align: center; }
    button:hover { background: #0076ce; }
    #status { position: absolute; bottom: 10px; left: 20px; color: #ffeb3b; font-size: 12px; font-weight: bold; }
  </style>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>

  <div class="controls">
    <button onclick="toggleMesh(['rotor'])">Rotor</button>
    <button onclick="toggleMesh(['shaft'])">Shaft</button>
    <button onclick="toggleMesh(['bearing'])">Bearings</button>
    <button onclick="toggleMesh(['winding', 'coil'])">Windings</button>
    <button onclick="toggleMesh(['fan', 'cool', 'blade', 'cover'])">Fan / Cooling</button>
    <button onclick="toggleMesh(['seal'])">Seals</button>
    <button onclick="toggleMesh(['mount', 'frame', 'base'])">Mounting</button>
    <button onclick="toggleMesh(['bolt', 'screw', 'fastener'])">Bolts / Fasteners</button>
    <button onclick="toggleMesh(['stator', 'housing', 'casing', 'body', 'shell'])">Stator</button>
    <button onclick="showAll()">Show All</button>
  </div>

  <div id="status"></div>

  <model-viewer 
    id="motor"
    src="https://cdn.jsdelivr.net/gh/LISHWITHA/motor-model@main/total-electricmotor.glb" 
    alt="3D Induction Motor" 
    auto-rotate 
    camera-controls 
    shadow-intensity="1">
  </model-viewer>

  <script>
    const viewer = document.querySelector('#motor');
    const status = document.querySelector('#status');

    viewer.addEventListener('load', () => {
      console.log("--- All Meshes in Model ---");
      viewer.model.materials.forEach(mat => console.log("Material:", mat.name));
    });

    window.toggleMesh = function(keywords) {
      if (!viewer.model) return;
      
      let matchedCount = 0;
      viewer.model.materials.forEach(mat => {
        const matName = mat.name.toLowerCase();
        const matches = keywords.some(kw => matName.includes(kw.toLowerCase()));
        
        if (matches) {
          mat.setAlphaFactor(mat.getAlphaFactor() === 0 ? 1 : 0);
          matchedCount++;
        }
      });

      if (matchedCount === 0) {
        status.innerText = "No matching material keywords found for: " + keywords.join(', ');
      } else {
        status.innerText = "Toggled " + matchedCount + " mesh group(s).";
      }
    };

    window.showAll = function() {
      if (!viewer.model) return;
      viewer.model.materials.forEach(mat => mat.setAlphaFactor(1));
      status.innerText = "Showing all components";
    };
  </script>
</body>
</html>
