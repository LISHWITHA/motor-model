<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Twin of Induction Motor</title>
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: #181b1f; 
      font-family: sans-serif; 
    }
    model-viewer { 
      width: 100vw; 
      height: 100vh; 
    }
    .controls { 
      position: absolute; 
      top: 20px; 
      left: 20px; 
      display: flex; 
      flex-direction: column; 
      gap: 8px; 
      z-index: 10; 
      max-height: 90vh; 
      overflow-y: auto; 
    }
    button { 
      padding: 8px 16px; 
      background: #0096ff; 
      color: white; 
      border: none; 
      border-radius: 6px; 
      cursor: pointer; 
      font-weight: bold; 
      font-size: 13px; 
      text-align: left; 
    }
    button:hover { 
      background: #0076ce; 
    }
    #status { 
      position: absolute; 
      bottom: 10px; 
      left: 20px; 
      color: #ffeb3b; 
      font-size: 12px; 
      font-weight: bold; 
      background: rgba(0,0,0,0.6); 
      padding: 6px 10px; 
      border-radius: 4px; 
    }
  </style>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>

  <div class="controls">
    <button onclick="toggleMesh(['rotor'])">Rotor</button>
    <button onclick="toggleMesh(['shaft'])">Shaft</button>
    <button onclick="toggleMesh(['bearing'])">Bearings</button>
    <button onclick="toggleMesh(['winding', 'coil', 'copper'])">Windings</button>
    <button onclick="toggleMesh(['fan', 'cool', 'blade', 'cover', 'guard', 'shield', 'cap', 'casing_rear'])">Fan / Cooling</button>
    <button onclick="toggleMesh(['seal', 'gasket'])">Seals</button>
    <button onclick="toggleMesh(['mount', 'base', 'feet'])">Mounting</button>
    <button onclick="toggleMesh(['bolt', 'screw', 'fastener', 'pin'])">Bolts / Fasteners</button>
    <button onclick="toggleMesh(['stator', 'housing', 'casing', 'body', 'frame', 'shell', 'main', 'outer', 'motor_body'])">Stator</button>
    <button onclick="showAll()">Show All</button>
  </div>

  <div id="status">Ready</div>

  <model-viewer 
    id="motor"
    src="https://cdn.jsdelivr.net/gh/LISHWITHA/motor-model@main/total-electricmotor.glb" 
    alt="3D Induction Motor" 
    auto-rotate 
    camera-controls 
    shadow-intensity="1">
  </model-viewer>

  <script>
    const viewer = document.querySelector('#motor');
    const status = document.querySelector('#status');

    window.toggleMesh = function(keywords) {
      if (!viewer.model || !viewer.model.materials) return;
      
      let matchedCount = 0;

      viewer.model.materials.forEach(mat => {
        const matName = mat.name.toLowerCase();
        
        const isMatch = keywords.some(kw => matName.includes(kw.toLowerCase()));
        
        if (isMatch) {
          const currentAlpha = mat.getAlphaFactor();
          mat.setAlphaFactor(currentAlpha === 0 ? 1 : 0);
          matchedCount++;
        }
      });

      if (matchedCount === 0) {
        status.innerText = "No meshes found for " + keywords[0];
      } else {
        status.innerText = "Toggled " + matchedCount + " part(s)";
      }
    };

    window.showAll = function() {
      if (!viewer.model || !viewer.model.materials) return;
      viewer.model.materials.forEach(mat => mat.setAlphaFactor(1));
      status.innerText = "Showing all components";
    };
  </script>
</body>
</html>
