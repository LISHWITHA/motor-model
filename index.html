<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Motor Viewer</title>
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: #181b1f; 
    }
    model-viewer { 
      width: 100vw; 
      height: 100vh; 
    }
  </style>
<script async src="https://ga.jspm.io/npm:es-module-shims@1.7.1/dist/es-module-shims.js"></script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@^0.183.0/build/three.module.min.js"
  }
}
</script>

<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer-module.min.js"></script>

<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer-effects/dist/model-viewer-effects.min.js"></script>
<body>
  <div id="controls">
  <button onclick="selectPart('rotor')">Rotor</button>
  <button onclick="selectPart('shaft')">Shaft</button>
  <button onclick="selectPart('bearing')">Bearings</button>
  <button onclick="selectPart('winding')">Windings</button>
  <button onclick="selectPart('fan')">Fan</button>
  <button onclick="selectPart('seal')">Seals</button>
  <button onclick="selectPart('mounting')">Mounting</button>
  <button onclick="selectPart('fastener')">Fasteners</button>
  <button onclick="selectPart('all')">Show All</button>
</div>
  <model-viewer 
    src="https://cdn.jsdelivr.net/gh/LISHWITHA/motor-model@main/total-electricmotor.glb" 
    alt="3D Induction Motor" 
    auto-rotate 
    camera-controls 
    shadow-intensity="1">
    <effect-composer render-mode="quality">
    <outline-effect selection="rdzen_wirnikastpSTEP-2-1"></outline-effect>
</effect-composer>
  </model-viewer>
<script>
const motor = document.querySelector('model-viewer');
  let scene = null;

motor.addEventListener('load', () => {
    console.log('Motor loaded!');

    const symbols = Object.getOwnPropertySymbols(motor);
    const sceneSymbol = symbols.find(
        s => s.description === 'scene'
    );

    if (!sceneSymbol) {
        console.log('Internal scene not found');
        return;
    }

     scene = motor[sceneSymbol];

    console.log('===== MOTOR COMPONENTS =====');

    scene.traverse((object) => {
        if (object.isMesh) {
            console.log(object.name);
        }
    });
});
 const originalMaterialColors = new Map();

function selectPart(part) {

    if (!scene || !motor.model) {
        console.log("Model not ready");
        return;
    }

    const patterns = {

        rotor: /rdzen_wirnika|wirnik/i,

        shaft: /wal_silnik|shaft/i,

        bearing: /lozysko|bearing60|kulkastp|koszyczek/i,

        winding: /uzwojenie/i,

        fan: /wentillator|ventilator|fan/i,

        seal: /seal/i,

        mounting: /motor_mounting|mounting/i,

        fastener: /M6nut|M8_|M6_20_imbus|nut|bolt|screw/i
    };

    // Restore previous colors
    originalMaterialColors.forEach((color, material) => {
        material.pbrMetallicRoughness.setBaseColorFactor(color);
    });

    originalMaterialColors.clear();

    if (part === "all") {
        console.log("Showing all components");
        return;
    }

    const pattern = patterns[part];

    if (!pattern) {
        console.log("Unknown component:", part);
        return;
    }

    const selectedMaterials = new Set();

    scene.traverse((object) => {

        if (!object.isMesh) return;

        if (pattern.test(object.name)) {

            console.log("HIGHLIGHT:", object.name);

            if (object.material) {

                const materialName = object.material.name;

                const material =
                    motor.model.materials.find(
                        m => m.name === materialName
                    );

                if (material && !originalMaterialColors.has(material)) {

                    originalMaterialColors.set(
                        material,
                        material.pbrMetallicRoughness.baseColorFactor
                    );

                    selectedMaterials.add(material);
                }
            }
        }
    });

    // Highlight selected materials
    selectedMaterials.forEach((material) => {

        material.pbrMetallicRoughness
            .setBaseColorFactor("#ff0000");

        material.setEmissiveFactor("#ff0000");
        material.setEmissiveStrength(1.5);
    });

    console.log(
        "Selected component:",
        part,
        "| Materials:",
        selectedMaterials.size
    );
}

window.selectPart = selectPart;
</script>

 

</body>
</html>
