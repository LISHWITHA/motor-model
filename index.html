<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Twin of Induction Motor</title>
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: #181b1f; 
      font-family: sans-serif; 
    }
    model-viewer { 
      width: 100vw; 
      height: 100vh; 
    }
    .controls { 
      position: absolute; 
      top: 15px; 
      left: 15px; 
      display: flex; 
      flex-direction: column; 
      gap: 6px; 
      z-index: 10; 
      max-height: 90vh; 
      overflow-y: auto; 
    }
    button { 
      padding: 8px 14px; 
      background: #0096ff; 
      color: white; 
      border: none; 
      border-radius: 6px; 
      cursor: pointer; 
      font-weight: bold; 
      font-size: 12px; 
      text-align: left; 
    }
    button:hover { 
      background: #0076ce; 
    }
    #status { 
      position: absolute; 
      bottom: 10px; 
      left: 15px; 
      color: #ffeb3b; 
      font-size: 12px; 
      font-weight: bold; 
      background: rgba(0,0,0,0.7); 
      padding: 6px 12px; 
      border-radius: 4px; 
    }
  </style>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>

  <div class="controls">
    <button onclick="togglePart(['rotor', 'shaft'], 0)">Rotor & Shaft</button>
    <button onclick="togglePart(['bearing', 'ring'], 1)">Bearings</button>
    <button onclick="togglePart(['winding', 'coil', 'copper', 'wire'], 2)">Windings</button>
    <button onclick="togglePart(['fan', 'cool', 'blade', 'cover', 'guard'], 3)">Fan / Cooling</button>
    <button onclick="togglePart(['seal', 'gasket'], 4)">Seals</button>
    <button onclick="togglePart(['mount', 'base', 'feet', 'stand'], 5)">Mounting</button>
    <button onclick="togglePart(['bolt', 'screw', 'fastener', 'pin', 'nut'], 6)">Bolts / Fasteners</button>
    <button onclick="togglePart(['stator', 'housing', 'casing', 'body', 'frame', 'shell'], 7)">Stator / Casing</button>
    <button onclick="showAll()">Show All Components</button>
  </div>

  <div id="status">3D Model Ready</div>

  <model-viewer 
    id="motor"
    src="https://cdn.jsdelivr.net/gh/LISHWITHA/motor-model@main/total-electricmotor.glb" 
    alt="3D Induction Motor" 
    auto-rotate 
    camera-controls 
    shadow-intensity="1">
  </model-viewer>

  <script>
    const viewer = document.querySelector('#motor');
    const status = document.querySelector('#status');

    window.togglePart = function(keywords, fallbackIndex) {
      if (!viewer.model || !viewer.model.materials) return;

      const materials = viewer.model.materials;
      let matchedCount = 0;

      // 1. Try keyword matching on material names
      materials.forEach(mat => {
        const matName = mat.name.toLowerCase();
        if (keywords.some(kw => matName.includes(kw.toLowerCase()))) {
          const currentAlpha = mat.getAlphaFactor();
          mat.setAlphaFactor(currentAlpha === 0 ? 1 : 0);
          matchedCount++;
        }
      });

      // 2. Fallback to material layer indexing if CAD names are non-descriptive
      if (matchedCount === 0 && materials.length > 0) {
        const targetMat = materials[fallbackIndex % materials.length];
        if (targetMat) {
          const currentAlpha = targetMat.getAlphaFactor();
          targetMat.setAlphaFactor(currentAlpha === 0 ? 1 : 0);
          status.innerText = "Toggled Component Layer " + (fallbackIndex + 1) + " (" + (targetMat.name || 'Mesh ' + fallbackIndex) + ")";
          return;
        }
      }

      if (matchedCount > 0) {
        status.innerText = "Toggled " + matchedCount + " matching mesh(es)";
      } else {
        status.innerText = "No material layers found";
      }
    };

    window.showAll = function() {
      if (!viewer.model || !viewer.model.materials) return;
      viewer.model.materials.forEach(mat => mat.setAlphaFactor(1));
      status.innerText = "Showing all components";
    };
  </script>
</body>
</html>
