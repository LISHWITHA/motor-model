<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Twin of Induction Motor</title>
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: #181b1f; 
      font-family: sans-serif; 
    }
    model-viewer { 
      width: 100vw; 
      height: 100vh; 
    }
    .controls { 
      position: absolute; 
      top: 15px; 
      left: 15px; 
      display: flex; 
      flex-direction: column; 
      gap: 6px; 
      z-index: 10; 
      max-height: 90vh; 
      overflow-y: auto; 
    }
    button { 
      padding: 8px 14px; 
      background: #0096ff; 
      color: white; 
      border: none; 
      border-radius: 6px; 
      cursor: pointer; 
      font-weight: bold; 
      font-size: 12px; 
      text-align: left; 
    }
    button:hover { 
      background: #0076ce; 
    }
    #status { 
      position: absolute; 
      bottom: 10px; 
      left: 15px; 
      color: #ffeb3b; 
      font-size: 12px; 
      font-weight: bold; 
      background: rgba(0,0,0,0.7); 
      padding: 6px 12px; 
      border-radius: 4px; 
    }
  </style>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>

  <div class="controls">
    <button onclick="toggleByLayer(0)">Outer Frame / Casing</button>
    <button onclick="toggleByLayer(1)">Stator Core</button>
    <button onclick="toggleByLayer(2)">Rotor & Shaft</button>
    <button onclick="toggleByLayer(3)">Windings / Coils</button>
    <button onclick="toggleByLayer(4)">Fan & Cooling Cap</button>
    <button onclick="toggleByLayer(5)">Bearings & Seals</button>
    <button onclick="toggleByLayer(6)">Mounting / Bolts</button>
    <button onclick="showAll()">Show All</button>
  </div>

  <div id="status">Loading 3D Motor...</div>

  <model-viewer 
    id="motor"
    src="https://cdn.jsdelivr.net/gh/LISHWITHA/motor-model@main/total-electricmotor.glb" 
    alt="3D Induction Motor" 
    auto-rotate 
    camera-controls 
    shadow-intensity="1">
  </model-viewer>

  <script>
    const viewer = document.querySelector('#motor');
    const status = document.querySelector('#status');

    viewer.addEventListener('load', () => {
      const total = viewer.model ? viewer.model.materials.length : 0;
      status.innerText = "Model Loaded (" + total + " material layers found)";
    });

    window.toggleByLayer = function(layerIdx) {
      if (!viewer.model || !viewer.model.materials) return;
      
      const materials = viewer.model.materials;
      if (materials.length === 0) {
        status.innerText = "No materials detected in GLTF";
        return;
      }

      // Safe index modulo mapping across all CAD materials
      const idx = layerIdx % materials.length;
      const mat = materials[idx];
      
      if (mat) {
        const currentAlpha = mat.getAlphaFactor();
        const nextAlpha = currentAlpha === 0 ? 1 : 0;
        mat.setAlphaFactor(nextAlpha);
        
        status.innerText = (nextAlpha === 0 ? "Hidden: " : "Shown: ") + 
          (mat.name ? mat.name : "Layer " + (idx + 1));
      }
    };

    window.showAll = function() {
      if (!viewer.model || !viewer.model.materials) return;
      viewer.model.materials.forEach(mat => mat.setAlphaFactor(1));
      status.innerText = "Showing all components";
    };
  </script>
</body>
</html>
