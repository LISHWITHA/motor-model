<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Motor Viewer</title>
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: #181b1f; 
    }
    model-viewer { 
      width: 100vw; 
      height: 100vh; 
    }
  </style>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>
  <model-viewer 
    src="https://cdn.jsdelivr.net/gh/LISHWITHA/motor-model@main/total-electricmotor.glb" 
    alt="3D Induction Motor" 
    auto-rotate 
    camera-controls 
    shadow-intensity="1">
  </model-viewer>

<script>
const motor = document.querySelector('model-viewer');

motor.addEventListener('load', () => {
    console.log('Motor loaded!');

    const scene = motor.model?.scene;

    if (!scene) {
        console.log('Scene not available');
        return;
    }

    console.log('===== MOTOR COMPONENTS =====');

    scene.traverse((object) => {
        if (object.isMesh) {
            console.log(object.name);
        }
    });
});
</script>

</body>
</html>
