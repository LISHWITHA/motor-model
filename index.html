<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Twin of Induction Motor</title>
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: #181b1f; 
      font-family: sans-serif; 
    }
    model-viewer { 
      width: 100vw; 
      height: 100vh; 
    }
    .controls { 
      position: absolute; 
      top: 15px; 
      left: 15px; 
      display: flex; 
      flex-direction: column; 
      gap: 6px; 
      z-index: 10; 
      max-height: 90vh; 
      overflow-y: auto; 
    }
    button { 
      padding: 8px 14px; 
      background: #0096ff; 
      color: white; 
      border: none; 
      border-radius: 6px; 
      cursor: pointer; 
      font-weight: bold; 
      font-size: 12px; 
      text-align: left; 
    }
    button:hover { 
      background: #0076ce; 
    }
    #status { 
      position: absolute; 
      bottom: 10px; 
      left: 15px; 
      color: #ffeb3b; 
      font-size: 12px; 
      font-weight: bold; 
      background: rgba(0,0,0,0.7); 
      padding: 6px 12px; 
      border-radius: 4px; 
    }
  </style>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>

  <div class="controls">
    <button onclick="toggleMesh(0)">Rotor</button>
    <button onclick="toggleMesh(1)">Shaft</button>
    <button onclick="toggleMesh(2)">Bearings</button>
    <button onclick="toggleMesh(3)">Windings</button>
    <button onclick="toggleMesh(4)">Fan / Cooling</button>
    <button onclick="toggleMesh(5)">Seals</button>
    <button onclick="toggleMesh(6)">Mounting</button>
    <button onclick="toggleMesh(7)">Bolts / Fasteners</button>
    <button onclick="toggleMesh(8)">Stator</button>
    <button onclick="showAll()">Show All</button>
  </div>

  <div id="status">Loading 3D Model...</div>

  <model-viewer 
    id="motor"
    src="https://cdn.jsdelivr.net/gh/LISHWITHA/motor-model@main/total-electricmotor.glb" 
    alt="3D Induction Motor" 
    auto-rotate 
    camera-controls 
    shadow-intensity="1">
  </model-viewer>

  <script>
    const viewer = document.querySelector('#motor');
    const status = document.querySelector('#status');
    let meshes = [];

    // Wait until 3D model is fully loaded before getting mesh components
    viewer.addEventListener('load', () => {
      meshes = [];
      const sceneSymbol = Object.getOwnPropertySymbols(viewer).find(s => s.description === 'scene');
      const scene = viewer[sceneSymbol];

      if (scene) {
        scene.traverse((obj) => {
          if (obj.isMesh) {
            meshes.push(obj);
          }
        });
        status.innerText = "Model Ready (" + meshes.length + " total meshes ready)";
      } else {
        // Fallback to materials array
        if (viewer.model && viewer.model.materials) {
          meshes = viewer.model.materials;
          status.innerText = "Model Ready (" + meshes.length + " materials ready)";
        }
      }
    });

    window.toggleMesh = function(index) {
      if (meshes.length === 0) {
        status.innerText = "Please wait, model is still loading...";
        return;
      }

      // Safeguard index modulo across detected mesh objects
      const targetIdx = index % meshes.length;
      const item = meshes[targetIdx];

      if (item) {
        if (item.isMesh) {
          item.visible = !item.visible;
          status.innerText = (item.visible ? "Shown: " : "Hidden: ") + (item.name || "Mesh " + (targetIdx + 1));
        } else if (item.setAlphaFactor) {
          const currentAlpha = item.getAlphaFactor();
          const nextAlpha = currentAlpha === 0 ? 1 : 0;
          item.setAlphaFactor(nextAlpha);
          status.innerText = (nextAlpha === 0 ? "Hidden: " : "Shown: ") + (item.name || "Material " + (targetIdx + 1));
        }
      }
    };

    window.showAll = function() {
      if (meshes.length === 0) return;
      meshes.forEach(item => {
        if (item.isMesh) item.visible = true;
        if (item.setAlphaFactor) item.setAlphaFactor(1);
      });
      status.innerText = "Showing all components";
    };
  </script>
</body>
</html>
