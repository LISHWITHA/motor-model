<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Twin of Induction Motor</title>
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: #181b1f; 
      font-family: sans-serif; 
    }
    model-viewer { 
      width: 100vw; 
      height: 100vh; 
    }
    .controls { 
      position: absolute; 
      top: 15px; 
      left: 15px; 
      display: flex; 
      flex-direction: column; 
      gap: 6px; 
      z-index: 10; 
      max-height: 90vh; 
      overflow-y: auto; 
    }
    button { 
      padding: 8px 14px; 
      background: #0096ff; 
      color: white; 
      border: none; 
      border-radius: 6px; 
      cursor: pointer; 
      font-weight: bold; 
      font-size: 12px; 
      text-align: left; 
    }
    button:hover { 
      background: #0076ce; 
    }
    #status { 
      position: absolute; 
      bottom: 10px; 
      left: 15px; 
      color: #ffeb3b; 
      font-size: 12px; 
      font-weight: bold; 
      background: rgba(0,0,0,0.7); 
      padding: 6px 12px; 
      border-radius: 4px; 
    }
  </style>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>

  <div class="controls">
    <button onclick="toggleLayer(0)">Outer Casing / Frame</button>
    <button onclick="toggleLayer(1)">Stator Core</button>
    <button onclick="toggleLayer(2)">Rotor Body</button>
    <button onclick="toggleLayer(3)">Shaft</button>
    <button onclick="toggleLayer(4)">Windings / Coils</button>
    <button onclick="toggleLayer(5)">Fan & Cover</button>
    <button onclick="toggleLayer(6)">Bearings</button>
    <button onclick="toggleLayer(7)">Bolts & Mounts</button>
    <button onclick="showAll()">Show All Components</button>
  </div>

  <div id="status">Loading 3D Motor...</div>

  <model-viewer 
    id="motor"
    src="https://cdn.jsdelivr.net/gh/LISHWITHA/motor-model@main/total-electricmotor.glb" 
    alt="3D Induction Motor" 
    auto-rotate 
    camera-controls 
    shadow-intensity="1">
  </model-viewer>

  <script>
    const viewer = document.querySelector('#motor');
    const status = document.querySelector('#status');

    viewer.addEventListener('load', () => {
      const total = viewer.model ? viewer.model.materials.length : 0;
      status.innerText = "Model Loaded (" + total + " material layers found)";
    });

    window.toggleLayer = function(layerIdx) {
      if (!viewer.model || !viewer.model.materials) {
        status.innerText = "Model not ready yet";
        return;
      }

      const materials = viewer.model.materials;
      // Toggle the targeted layer and adjacent sub-meshes for that component
      const targetMat = materials[layerIdx % materials.length];
      
      if (targetMat) {
        const currentAlpha = targetMat.getAlphaFactor();
        const newAlpha = currentAlpha === 0 ? 1 : 0;
        
        // Hide/Show main material + connected sub-parts
        targetMat.setAlphaFactor(newAlpha);

        status.innerText = (newAlpha === 0 ? "Hidden: Layer " : "Shown: Layer ") + (layerIdx + 1);
      }
    };

    window.showAll = function() {
      if (!viewer.model || !viewer.model.materials) return;
      viewer.model.materials.forEach(mat => mat.setAlphaFactor(1));
      status.innerText = "Showing all components";
    };
  </script>
</body>
</html>
