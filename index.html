<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Twin of Induction Motor</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #181b1f; font-family: sans-serif; }
    model-viewer { width: 100vw; height: 100vh; }
    .controls { position: absolute; top: 20px; left: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 10; max-height: 90vh; overflow-y: auto; }
    button { padding: 8px 16px; background: #0096ff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; text-align: left; }
    button:hover { background: #0076ce; }
    #status { position: absolute; bottom: 10px; left: 20px; color: #ffeb3b; font-size: 12px; font-weight: bold; background: rgba(0,0,0,0.6); padding: 6px 10px; border-radius: 4px; }
  </style>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>

  <div class="controls">
    <button onclick="toggleComponent(['rotor'])">Rotor</button>
    <button onclick="toggleComponent(['shaft'])">Shaft</button>
    <button onclick="toggleComponent(['bearing'])">Bearings</button>
    <button onclick="toggleComponent(['winding', 'coil', 'wire'])">Windings</button>
    <button onclick="toggleComponent(['fan', 'cool', 'blade', 'cover', 'impeller', 'rear'])">Fan / Cooling</button>
    <button onclick="toggleComponent(['seal', 'gasket'])">Seals</button>
    <button onclick="toggleComponent(['mount', 'frame', 'base', 'feet'])">Mounting</button>
    <button onclick="toggleComponent(['bolt', 'screw', 'fastener', 'pin'])">Bolts / Fasteners</button>
    <button onclick="toggleComponent(['stator', 'housing', 'casing', 'body', 'shell', 'main', 'outer', 'case'])">Stator</button>
    <button onclick="showAll()">Show All</button>
  </div>

  <div id="status">Ready</div>

  <model-viewer 
    id="motor"
    src="https://cdn.jsdelivr.net/gh/LISHWITHA/motor-model@main/total-electricmotor.glb" 
    alt="3D Induction Motor" 
    auto-rotate 
    camera-controls 
    shadow-intensity="1">
  </model-viewer>

  <script>
    const viewer = document.querySelector('#motor');
    const status = document.querySelector('#status');

    window.toggleComponent = function(keywords) {
      if (!viewer.model) return;

      let hiddenCount = 0;
      let visibleCount = 0;

      // 1. Check & toggle Materials
      viewer.model.materials.forEach(mat => {
        const matName = mat.name.toLowerCase();
        if (keywords.some(kw => matName.includes(kw.toLowerCase()))) {
          const currentAlpha = mat.getAlphaFactor();
          const newAlpha = currentAlpha === 0 ? 1 : 0;
          mat.setAlphaFactor(newAlpha);
          if (newAlpha === 0) hiddenCount++; else visibleCount++;
        }
      });

      // 2. Check & toggle Scene Nodes
      const scene = viewer.model.drawables || [];
      scene.forEach(node => {
        if (node.name) {
          const nodeName = node.name.toLowerCase();
          if (keywords.some(kw => nodeName.includes(kw.toLowerCase()))) {
            node.visible = !node.visible;
            if (!node.visible) hiddenCount++; else visibleCount++;
          }
        }
      });

      if (hiddenCount === 0 && visibleCount === 0) {
        status.innerText = "No parts matched: " + keywords.join(', ');
      } else {
        status.innerText = "Toggled parts matching: " + keywords.join(', ');
      }
    };

    window.showAll = function() {
      if (!viewer.model) return;
      
      viewer.model.materials.forEach(mat => mat.setAlphaFactor(1));
      
      const scene = viewer.model.drawables || [];
      scene.forEach(node => { node.visible = true; });

      status.innerText = "Showing all components";
    };
  </script>
</body>
</html>
