<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Twin of Induction Motor</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #181b1f; font-family: sans-serif; }
    model-viewer { width: 100vw; height: 100vh; }
    .controls { position: absolute; top: 15px; left: 15px; display: flex; flex-direction: column; gap: 6px; z-index: 10; max-height: 90vh; overflow-y: auto; }
    button { padding: 8px 14px; background: #0096ff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; text-align: left; }
    button:hover { background: #0076ce; }
    #status { position: absolute; bottom: 10px; left: 15px; color: #ffeb3b; font-size: 12px; font-weight: bold; background: rgba(0,0,0,0.7); padding: 6px 12px; border-radius: 4px; }
  </style>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>

  <div class="controls">
    <button onclick="toggleMaterialGroup(0)">Outer Frame / Casing</button>
    <button onclick="toggleMaterialGroup(1)">Stator & Coils</button>
    <button onclick="toggleMaterialGroup(2)">Rotor & Shaft</button>
    <button onclick="toggleMaterialGroup(3)">Fan & Cap</button>
    <button onclick="showAll()">Reset / Show All</button>
  </div>

  <div id="status">3D Model Ready</div>

  <model-viewer 
    id="motor"
    src="https://cdn.jsdelivr.net/gh/LISHWITHA/motor-model@main/total-electricmotor.glb" 
    alt="3D Induction Motor" 
    auto-rotate 
    camera-controls 
    shadow-intensity="1">
  </model-viewer>

  <script>
    const viewer = document.querySelector('#motor');
    const status = document.querySelector('#status');

    window.toggleMaterialGroup = function(index) {
      if (!viewer.model || !viewer.model.materials) return;

      const materials = viewer.model.materials;
      if (materials.length === 0) {
        status.innerText = "No materials detected in GLTF file.";
        return;
      }

      // Cycle through material indexes safely
      const targetMat = materials[index % materials.length];
      if (targetMat) {
        const currentAlpha = targetMat.getAlphaFactor();
        const newAlpha = currentAlpha === 0 ? 1 : 0;
        targetMat.setAlphaFactor(newAlpha);
        status.innerText = "Toggled Part Layer " + (index + 1) + " (" + targetMat.name + ")";
      } else {
        status.innerText = "Layer index out of range. Total layers: " + materials.length;
      }
    };

    window.showAll = function() {
      if (!viewer.model) return;
      viewer.model.materials.forEach(mat => mat.setAlphaFactor(1));
      status.innerText = "All layers visible";
    };
  </script>
</body>
</html>
